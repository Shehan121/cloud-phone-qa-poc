# Example scenario catalogue for the Mobilerun QA service.
# Every check reads real state. Endpoint names are from docs.mobilerun.ai and
# the official SDK (mobilerun-sdk 6.0.0). "direct_path" is how the runner
# repeats the action without the agent, to tell a product bug from an agent mistake.

- id: settings-timezone-tokyo
  task: Open the Settings app and change the phone's time zone to Tokyo, Japan.
  checker: phone state (API)
  check: GET /devices/{id}/timezone == "Asia/Tokyo"
  direct_path: POST /devices/{id}/timezone, then read it back
  status: implemented in qa_check.py

- id: settings-language-german
  task: Change the phone's language to German.
  checker: phone state (API)
  check: GET /devices/{id}/language -> locale starts with "de"
  direct_path: POST /devices/{id}/language, then read it back
  note: reset the language afterwards so later scenarios are not affected

- id: open-chrome
  task: Open the Chrome browser.
  checker: phone state (API)
  check: GET /devices/{id}/ui-state -> phone_state.packageName == "com.android.chrome"
  direct_path: PUT /devices/{id}/apps/com.android.chrome (start app)

- id: settings-dark-theme
  task: Turn on dark theme in the display settings.
  checker: phone state (API)
  check: open Settings > Display, read ui-state, the dark theme switch has isChecked == true
  direct_path: start Settings, find the switch in ui-state, POST /devices/{id}/tap on its bounds
  note: the switch label depends on the Android version, keep the lookup in one place

- id: website-login
  task: Open Chrome, go to the QA test website and log in as the test user.
  checker: own test website backend
  check: backend log has a successful login for the test user after the task started
  direct_path: none (the backend itself is the ground truth)

- id: website-form
  task: On the QA test website fill in the contact form with the given name and text and submit it.
  checker: own test website backend
  check: backend has exactly one submission with the same name and text
  direct_path: none

- id: download-file
  task: On the QA test website download the file report.pdf.
  checker: phone state (API)
  check: GET /devices/{id}/files (list files) contains report.pdf
  direct_path: none

- id: proxy-country
  task: Open the echo page on the QA test website and tell me which country it shows.
  checker: own test website backend
  check: backend logged the request from an IP in the proxy's country, and the agent's answer names that country
  note: the proxy state API only returns connected, name and protocol, so the echo page is needed

- id: message-second-phone
  task: Send the text "qa-ping-<run id>" to the test contact in the messaging app.
  checker: second cloud phone (receiver)
  check: receiver's ui-state shows a message containing "qa-ping-<run id>"
  note: weaker check, marked as such in the results

- id: api-max-steps
  task: A long task with maxSteps set to 3.
  checker: API check (no phone state)
  check: task ends in a terminal state with steps <= 3 and does not report completed
  note: tests that the limit really stops the agent

- id: api-webhook-signature
  task: Any short task with a webhook endpoint registered.
  checker: API check (own webhook receiver)
  check: task.run.completed arrives, X-Mobilerun-Signature verifies (HMAC-SHA256 over "{timestamp}.{rawBody}"), event id is new
